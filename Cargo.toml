[package]
name = "bannedcamp"
version = "1.3.0"
edition = "2024"
description = "Bandcamp library downloader"
license = "MIT"
repository = "https://github.com/BatteredBunny/bannedcamp"

[[bin]]
name = "bannedcamp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1.19"
reqwest = { version = "0.13.5", features = ["cookies", "stream", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = "9.5.0"
indicatif = "0.18.6"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
